    <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#E0E7FF">🧠 NEURAL KNOWLEDGE GRAPH</text>
    
    <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#A855F7" filter="url(#glow5)">MindGraph AI</text>
    <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">Semantic Vector Graph &amp; Autonomous RAG Knowledge Base</text>
    
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#1E293B" stroke="#A855F7" stroke-width="0.6"/>
      <text x="10" y="15" font-family="sans-serif" font-size="11" fill="#A855F7">PyTorch/GNN</text>
      
      <rect x="83" y="0" width="70" height="22" rx="4" fill="#1E293B" stroke="#6366F1" stroke-width="0.6"/>
      <text x="93" y="15" font-family="sans-serif" font-size="11" fill="#6366F1">LangChain</text>
      
      <rect x="161" y="0" width="65" height="22" rx="4" fill="#1E293B" stroke="#00F2FE" stroke-width="0.6"/>
      <text x="171" y="15" font-family="sans-serif" font-size="11" fill="#00F2FE">Qdrant</text>
    </g>
  </g>

  <g transform="translate(440, 40)">
    <circle cx="50" cy="30" r="6" fill="#A855F7"/>
    <circle cx="90" cy="50" r="6" fill="#00F2FE"/>
    <circle cx="40" cy="80" r="6" fill="#6366F1"/>
    <circle cx="80" cy="90" r="6" fill="#E879F9"/>
    <line x1="50" y1="30" x2="90" y2="50" stroke="#6366F1" stroke-width="1.5"/>
    <line x1="50" y1="30" x2="40" y2="80" stroke="#A855F7" stroke-width="1.5"/>
    <line x1="90" y1="50" x2="80" y2="90" stroke="#00F2FE" stroke-width="1.5"/>
