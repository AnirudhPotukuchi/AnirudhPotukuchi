    <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#F0ABFC">📝 EDTECH &amp; LINGUISTICS</text>
    
    <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#E879F9" filter="url(#glow3)">Words Fly</text>
    <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">Interactive Gamified Vocabulary &amp; Language Mastery Platform</text>
    
    <g transform="translate(0, 100)">
