<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#9333EA;#4FACFE;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7F00FF">
        <animate attributeName="stop-color" values="#7F00FF;#00F2FE;#9333EA;#7F00FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#9333EA;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-border" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .typing-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      fill: #38BDF8;
      white-space: pre;
    }
    .main-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #FDE68A;
      letter-spacing: 1px;
    }
    .tag-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
    }
    .code-text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
    }
    
    /* Animation Keyframes */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.5); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-320px); }
      100% { transform: translateY(320px); }
    }

    .floating-card {
      animation: floatCard 4s ease-in-out indefinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid Background -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F2FE" stroke-width="0.8" />
    </pattern>
    <rect width="900" height="320" fill="url(#grid)" />
  </g>

  <!-- Floating Glow Orbs in Background -->
  <circle cx="150" cy="80" r="100" fill="#00F2FE" opacity="0.08" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="240" r="120" fill="#9333EA" opacity="0.08" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Outer Cyber Border -->
  <rect x="3" y="3" width="894" height="314" rx="14" fill="none" stroke="url(#neon-border)" stroke-width="2" filter="url(#glow-border)" />

  <!-- Animated Glowing Nodes -->
  <circle cx="20" cy="20" r="3" fill="#00F2FE">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="880" cy="20" r="3" fill="#C084FC">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="300" r="3" fill="#C084FC">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="880" cy="300" r="3" fill="#00F2FE">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- TOP BADGE: SIH 2025 WINNER -->
  <g transform="translate(50, 40)">
    <rect width="230" height="28" rx="14" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="5" fill="#F59E0B">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" class="badge-text">🏆 SIH 2025 WINNER</text>
  </g>

  <!-- MAIN GREETING & NAME -->
  <g transform="translate(50, 115)">
    <text x="0" y="0" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18" letter-spacing="1">
      HELLO WORLD 👋 I'M
    </text>
    <text x="0" y="42" class="main-title" fill="url(#text-grad)" filter="url(#glow-border)">
      ANIRUDH POTUKUCHI
    </text>
  </g>

  <!-- TYPING SUBTITLE -->
  <g transform="translate(50, 195)">
    <rect x="-6" y="-18" width="510" height="30" rx="6" fill="#0F172A" opacity="0.7" stroke="#38BDF8" stroke-width="0.8" />
    <text x="8" y="2" class="typing-text">
      AI • Full Stack • Competitive Programmer
      <tspan fill="#00F2FE">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite">|</animate>
      </tspan>
    </text>
  </g>

  <!-- TECH TAG PILLS -->
  <g transform="translate(50, 245)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="8" fill="url(#glass-fill)" stroke="#00F2FE" stroke-width="0.8" />
      <text x="12" y="18" class="tag-text">🤖 AI &amp; ML</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(140, 0)">
      <rect width="145" height="28" rx="8" fill="url(#glass-fill)" stroke="#38BDF8" stroke-width="0.8" />
      <text x="12" y="18" class="tag-text">⚡ Full Stack</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(295, 0)">
      <rect width="165" height="28" rx="8" fill="url(#glass-fill)" stroke="#C084FC" stroke-width="0.8" />
      <text x="12" y="18" class="tag-text">💡 Problem Solving</text>
    </g>
  </g>

  <!-- RIGHT SIDE: FUTURISTIC CODE CARD (Glassmorphism terminal) -->
  <g transform="translate(580, 45)">
    <!-- Terminal Box -->
    <rect width="270" height="230" rx="12" fill="#090D16" stroke="url(#text-grad)" stroke-width="1.2" opacity="0.95" />
    
    <!-- Terminal Header Dots -->
    <circle cx="20" cy="18" r="4" fill="#EF4444" />
    <circle cx="34" cy="18" r="4" fill="#F59E0B" />
    <circle cx="48" cy="18" r="4" fill="#10B981" />
    <text x="70" y="22" font-family="monospace" font-size="11" fill="#64748B">anirudh.config.json</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#1E293B" stroke-width="1" />

    <!-- Code Content -->
    <g transform="translate(16, 58)" class="code-text">
      <text x="0" y="0" fill="#C084FC">{</text>
      <text x="12" y="20" fill="#38BDF8">"name"<tspan fill="#F87171">:</tspan> <tspan fill="#FDE68A">"Anirudh"</tspan>,</text>
      <text x="12" y="40" fill="#38BDF8">"role"<tspan fill="#F87171">:</tspan> <tspan fill="#FDE68A">"AI Engineer"</tspan>,</text>
      <text x="12" y="60" fill="#38BDF8">"award"<tspan fill="#F87171">:</tspan> <tspan fill="#FDE68A">"SIH 2025 Winner"</tspan>,</text>
      <text x="12" y="80" fill="#38BDF8">"location"<tspan fill="#F87171">:</tspan> <tspan fill="#FDE68A">"India 🇮🇳"</tspan>,</text>
      <text x="12" y="100" fill="#38BDF8">"interests"<tspan fill="#F87171">:</tspan> <tspan fill="#C084FC">[</tspan></text>
      <text x="24" y="120" fill="#4ADE80">"LLMs"</tspan><tspan fill="#94A3B8">,</tspan> <tspan fill="#4ADE80">"Web3"</tspan><tspan fill="#94A3B8">,</tspan> <tspan fill="#4ADE80">"Next.js"</tspan></text>
      <text x="12" y="140" fill="#C084FC">]</tspan><tspan fill="#94A3B8">,</tspan></text>
      <text x="12" y="160" fill="#38BDF8">"coffee_level"<tspan fill="#F87171">:</tspan> <tspan fill="#F59E0B">"9999+"</tspan></text>
      <text x="0" y="180" fill="#C084FC">}</text>
    </g>

    <!-- Glowing Corner Accent -->
    <path d="M 250 230 L 270 230 L 270 210 Z" fill="#00F2FE" opacity="0.6" />
  </g>
</svg>
