<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="200" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="596" height="196" rx="12" fill="none" stroke="url(#border)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Content -->
  <g transform="translate(30, 40)">
    <!-- Badge -->
    <rect width="170" height="24" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FDE68A">🏆 SIH 2025 WINNER</text>
    
    <!-- Title -->
    <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#00F2FE" filter="url(#glow)">VignanaSarathi</text>
    <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">AI-Powered Educational &amp; Career Guidance Ecosystem</text>
    
    <!-- Tech Stack -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
      <text x="10" y="15" font-family="sans-serif" font-size="11" fill="#38BDF8">Python AI</text>
      
      <rect x="83" y="0" width="65" height="22" rx="4" fill="#1E293B" stroke="#C084FC" stroke-width="0.6"/>
      <text x="93" y="15" font-family="sans-serif" font-size="11" fill="#C084FC">Next.js</text>
      
      <rect x="156" y="0" width="75" height="22" rx="4" fill="#1E293B" stroke="#4ADE80" stroke-width="0.6"/>
      <text x="166" y="15" font-family="sans-serif" font-size="11" fill="#4ADE80">FastAPI</text>

      <rect x="239" y="0" width="70" height="22" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="0.6"/>
      <text x="249" y="15" font-family="sans-serif" font-size="11" fill="#F59E0B">PyTorch</text>
    </g>
  </g>

  <!-- Illustration graphic on right -->
  <g transform="translate(430, 30)">
    <circle cx="70" cy="70" r="55" fill="#00F2FE" opacity="0.08" filter="url(#glow)"/>
    <path d="M40,90 L70,30 L100,90 Z" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="70" cy="30" r="8" fill="#00F2FE"/>
    <circle cx="40" cy="90" r="8" fill="#C084FC"/>
    <circle cx="100" cy="90" r="8" fill="#38BDF8"/>
    <line x1="40" y1="90" x2="100" y2="90" stroke="#00F2FE" stroke-width="1.5"/>
  </g>
</svg>
