<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="border2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="200" rx="14" fill="url(#bg2)"/>
  <rect x="2" y="2" width="596" height="196" rx="12" fill="none" stroke="url(#border2)" stroke-width="1.5" filter="url(#glow2)"/>
  
  <g transform="translate(30, 40)">
    <rect width="160" height="24" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#A7F3D0">💳 AI FINANCIAL TECH</text>
    
    <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#34D399" filter="url(#glow2)">PaisaPulse AI</text>
    <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">Smart Financial Analytics &amp; Intelligent Wealth Manager</text>
    
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.6"/>
      <text x="10" y="15" font-family="sans-serif" font-size="11" fill="#34D399">React / TS</text>
      
      <rect x="83" y="0" width="70" height="22" rx="4" fill="#1E293B" stroke="#60A5FA" stroke-width="0.6"/>
      <text x="93" y="15" font-family="sans-serif" font-size="11" fill="#60A5FA">Node.js</text>
      
      <rect x="161" y="0" width="80" height="22" rx="4" fill="#1E293B" stroke="#F472B6" stroke-width="0.6"/>
      <text x="171" y="15" font-family="sans-serif" font-size="11" fill="#F472B6">Gemini AI</text>
    </g>
  </g>

  <g transform="translate(430, 40)">
    <polyline points="10,80 40,60 70,75 100,30 130,45" fill="none" stroke="#34D399" stroke-width="3" filter="url(#glow2)"/>
    <circle cx="100" cy="30" r="5" fill="#60A5FA"/>
    <circle cx="130" cy="45" r="5" fill="#34D399"/>
  </g>
