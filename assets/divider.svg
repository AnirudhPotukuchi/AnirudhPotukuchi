<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="30">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0" />
      <stop offset="15%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="1" />
      <stop offset="85%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Line -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#divider-grad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Center Diamond & Pulsing Ring -->
  <g transform="translate(450, 15)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#00F2FE" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
