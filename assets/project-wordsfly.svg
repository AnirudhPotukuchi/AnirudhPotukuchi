  </defs>
  <rect width="600" height="200" rx="14" fill="url(#bg3)"/>
  <rect x="2" y="2" width="596" height="196" rx="12" fill="none" stroke="url(#border3)" stroke-width="1.5" filter="url(#glow3)"/>
  
